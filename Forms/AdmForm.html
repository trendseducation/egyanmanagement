<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>🎓 EGyan Skill Development | Admission</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script src="../../Script/loginadmin.js" data-auto-init="true"></script>
    <script src="../../Script/footer-loader.js" data-footer="true" data-footer-path="footer.html"></script>

    <style>
    /* ======================== CSS VARIABLES ======================== */
    :root {
        --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --bg-secondary: #ffffff;
        --bg-body: #f4f7fc;
        --card-bg: rgba(255, 255, 255, 0.98);
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #5b6e8c;
        --text-light: #94a3b8;
        --border-color: #e2e8f0;
        --border-light: #e2e8f0;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);

        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --primary-light: #60a5fa;
        --secondary: #f59e0b;
        --secondary-dark: #d97706;
        --success: #10b981;
        --danger: #ef4444;
        --danger-light: rgba(239, 68, 68, 0.1);
        --warning: #fbbf24;
        --info: #06b6d4;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.08);
        --accent-glow: rgba(37, 99, 235, 0.15);

        --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        --gradient-accent: linear-gradient(135deg, #2563eb, #7c3aed);

        --table-header-bg: #f8fafc;
        --table-row-hover: #f1f5f9;
        --table-border: #e2e8f0;

        --transition-fast: 150ms ease;
        --transition-normal: 300ms ease;
        --transition-slow: 500ms ease;
    }

    [data-theme="dark"] {
        --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
        --bg-secondary: #1e1e2e;
        --bg-body: #0a0f1c;
        --card-bg: rgba(30, 30, 46, 0.98);
        --text-primary: #e2e8f0;
        --text-secondary: #94a3b8;
        --text-muted: #9ca3af;
        --text-light: #64748b;
        --border-color: #334155;
        --border-light: #1f2a3e;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);

        --table-header-bg: #1e293b;
        --table-row-hover: #334155;
        --table-border: #334155;
        --danger-light: rgba(239, 68, 68, 0.2);
        --accent-soft: rgba(59, 130, 246, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
        background: var(--bg-body);
        min-height: 100vh;
        padding: 20px 16px;
        color: var(--text-primary);
        transition: background var(--transition-normal), color var(--transition-normal);
        position: relative;
        display: flex;
        flex-direction: column;
    }

    /* ======================== AUTH LOADING ======================== */
    #authLoading {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg-body); z-index: 9999;
        flex-direction: column; gap: 1.5rem;
    }
    #authLoading.hidden { display: none !important; }
    #authLoading .spinner {
        width: 50px; height: 50px;
        border: 4px solid var(--border-light);
        border-top: 4px solid var(--accent);
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    #authLoading p { color: var(--text-muted); font-weight: 500; font-size: 0.9rem; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ======================== APP CONTAINER ======================== */
    .app-container {
        max-width: 1400px; margin: 0 auto;
        animation: fadeIn 0.5s ease-out; flex: 1;
        display: flex; flex-direction: column;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .page { display: none; animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .page.active-page { display: block; }
    @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ======================== CARD ======================== */
    .soft-card {
        background: var(--card-bg);
        border-radius: 2rem;
        box-shadow: var(--shadow-xl);
        overflow: hidden;
        backdrop-filter: blur(10px);
        transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 24px;
    }
    .soft-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-xl); }

    /* ======================== CARD HEADER ======================== */
    .card-header {
        padding: 1.5rem 2rem;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-color);
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: nowrap; gap: 14px;
    }
    [data-theme="dark"] .card-header {
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
    }
    .card-header .brand-wrap {
        display: flex; align-items: center; gap: 12px;
        flex: 1; min-width: 0;
    }
    .card-header .brand-logo {
        width: 42px; height: 42px; border-radius: 10px;
        object-fit: contain; background: #fff;
        padding: 3px; box-shadow: var(--shadow-sm);
        flex-shrink: 0;
    }
    .card-header h2 {
        font-size: 1.5rem; font-weight: 800;
        background: var(--gradient-accent);
        -webkit-background-clip: text; background-clip: text;
        color: transparent; letter-spacing: -0.02em;
        flex: 1; min-width: 0; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
    }
    .card-header .header-badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--accent-soft); color: var(--accent);
        padding: 4px 14px; border-radius: 30px;
        font-size: 0.7rem; font-weight: 600;
        border: 1px solid var(--border-color); flex-shrink: 0;
    }

    /* ======================== SEARCH ======================== */
    .search-section {
        padding: 1.5rem 2rem;
        background: var(--card-bg);
        border-bottom: 1px solid var(--border-color);
    }
    .search-wrapper { width: 100%; }
    .search-wrapper input {
        width: 100%; padding: 14px 20px;
        border: 2px solid var(--border-color); border-radius: 60px;
        background: var(--bg-secondary); color: var(--text-primary);
        font-size: 0.95rem; font-family: inherit;
        transition: all var(--transition-fast); box-shadow: var(--shadow-sm);
    }
    .search-wrapper input::placeholder { color: var(--text-light); }
    .search-wrapper input:focus {
        outline: none; border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        transform: translateY(-1px);
    }

    /* ======================== BUTTONS ======================== */
    .btn {
        border: none; padding: 10px 24px; border-radius: 60px;
        font-weight: 600; font-size: 0.875rem; cursor: pointer;
        transition: all var(--transition-fast);
        display: inline-flex; align-items: center; gap: 8px;
        position: relative; overflow: hidden;
    }
    .btn::before {
        content: ''; position: absolute; top: 50%; left: 50%;
        width: 0; height: 0; border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
    }
    .btn:active::before { width: 300px; height: 300px; }

    .btn-primary { background: var(--gradient-accent); color: white; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); filter: brightness(1.05); }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary); color: white; transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: white; }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
    .btn-success:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-info { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; }
    .btn-info:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-sm { padding: 6px 16px; font-size: 0.75rem; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ======================== TABLE ======================== */
    .table-wrapper { overflow-x: auto; overflow-y: visible; scrollbar-width: thin; padding: 0; }
    .table-wrapper::-webkit-scrollbar { height: 6px; background: transparent; }
    .table-wrapper::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    .data-table {
        width: 100%; border-collapse: separate;
        border-spacing: 0; font-size: 0.875rem;
    }
    .data-table th {
        text-align: left; padding: 16px 20px;
        background: var(--table-header-bg); color: var(--primary);
        font-weight: 800; font-size: 0.85rem;
        text-transform: uppercase; letter-spacing: 0.8px;
        border-bottom: 3px solid var(--primary); position: relative;
    }
    .data-table th:first-child { border-top-left-radius: 12px; }
    .data-table th:last-child { border-top-right-radius: 12px; }
    .data-table td {
        padding: 16px 20px; border-bottom: 1px solid var(--table-border);
        color: var(--text-primary); transition: background var(--transition-fast);
        font-size: 0.9rem;
    }
    .data-table tr:hover td { background: var(--table-row-hover); }

    .view-action-btn {
        background: var(--gradient-accent); color: white; border: none;
        padding: 6px 16px; border-radius: 30px;
        font-size: 0.75rem; font-weight: 600; cursor: pointer;
        transition: all var(--transition-fast);
        display: inline-flex; align-items: center; gap: 6px;
    }
    .view-action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); filter: brightness(1.05); }

    /* ======================== DETAIL VIEW ======================== */
    .details-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem; padding: 2rem;
    }
    @media (max-width: 640px) {
        .details-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; padding: 1rem; }
    }
    .detail-card {
        background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
        border-radius: 1.2rem; padding: 1rem 1.2rem;
        transition: all var(--transition-fast);
        border: 1px solid var(--border-color); cursor: pointer;
    }
    .detail-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    .detail-label {
        font-size: 0.65rem; text-transform: uppercase;
        letter-spacing: 0.5px; color: var(--secondary); font-weight: 700;
    }
    .detail-value {
        font-weight: 700; font-size: 0.95rem;
        margin-top: 6px; color: var(--text-primary); word-break: break-word;
    }

    .action-row {
        padding: 1rem 2rem 2rem;
        display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap;
    }

    .profile-wrapper {
        display: flex; align-items: center; gap: 28px;
        padding: 2rem 2rem 0; flex-wrap: wrap;
    }
    .profile-img {
        width: 120px; height: 120px; border-radius: 1.2rem;
        object-fit: cover; border: 4px solid var(--primary);
        box-shadow: var(--shadow-lg); background: var(--table-header-bg);
    }
    .profile-info h3 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
    .profile-info p { color: var(--text-secondary); font-size: 0.95rem; }

    /* ======================== MODALS ======================== */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px);
        display: none; align-items: center; justify-content: center;
        z-index: 2000; visibility: hidden; opacity: 0;
        transition: all var(--transition-normal);
    }
    .modal-overlay.active { display: flex; visibility: visible; opacity: 1; }

    .modal-box {
        background: var(--card-bg); width: 92%; max-width: 900px;
        max-height: 85vh; border-radius: 2rem; overflow-y: auto;
        box-shadow: var(--shadow-xl);
        animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-header {
        background: var(--gradient-accent); padding: 1.2rem 1.5rem;
        display: flex; justify-content: space-between; align-items: center;
        position: sticky; top: 0; z-index: 10; color: white;
    }
    .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
    .close-modal {
        background: none; border: none; font-size: 2rem;
        cursor: pointer; color: white;
        transition: transform var(--transition-fast); line-height: 1;
    }
    .close-modal:hover { transform: rotate(90deg); }

    .modal-body { padding: 1.5rem; overflow-y: auto; max-height: calc(85vh - 70px); }

    /* ======================== FORMS ======================== */
    .form-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.2rem;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
        font-size: 0.7rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--secondary);
    }
    .field input, .field select, .field textarea {
        padding: 12px 16px; border-radius: 16px;
        border: 2px solid var(--border-color);
        background: var(--bg-secondary); color: var(--text-primary);
        font-size: 0.9rem; transition: all var(--transition-fast);
        font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
        outline: none; border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    .field input:disabled { background: var(--text-light); cursor: not-allowed; }
    .fullwidth { grid-column: 1 / -1; }

    /* Aadhar monospace feel */
    #fAadhar { font-family: 'Courier New', monospace; letter-spacing: 1px; }

    /* ======================== AUTOCOMPLETE (from yashtransport.html) ======================== */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--card-bg);
        border-radius: 16px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 9999;
        display: none;
        box-shadow: var(--shadow-lg);
        margin-top: 6px;
        border: 1px solid var(--border-color);
        scrollbar-width: none;
    }
    .autocomplete-list::-webkit-scrollbar { display: none; }
    .autocomplete-item {
        padding: 12px 16px;
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--text-primary);
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .autocomplete-item:hover { background: var(--primary); color: #fff; }

    /* Field hint + refresh link */
    .field-hint {
        font-size: 0.68rem; color: var(--text-light);
        margin-top: 2px; font-style: italic;
        display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .dd-retry {
        color: var(--primary); text-decoration: underline;
        cursor: pointer; font-size: 0.72rem; margin-left: 4px;
    }

    /* ======================== IMAGE UPLOAD SECTIONS ======================== */
    .image-section {
        border: 2px dashed var(--border-color);
        padding: 20px; border-radius: 1.2rem;
        text-align: center; margin: 20px 0;
        background: var(--table-header-bg);
        transition: all var(--transition-fast);
    }
    .image-section:hover { border-color: var(--primary); }
    .image-section label { cursor: pointer; color: var(--primary); font-weight: 700; font-size: 1rem; }
    .image-section + .image-section { margin-top: 12px; }

    #preview-container, #bg-preview-container {
        max-width: 400px; margin: 15px auto; display: none;
    }
    #image-to-crop, #bg-image-to-crop { max-width: 100%; display: block; }
    .crop-controls { margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-tool {
        background: var(--table-header-bg); border: 1px solid var(--border-color);
        padding: 8px 16px; border-radius: 30px;
        font-size: 0.8rem; font-weight: 600; cursor: pointer;
        transition: all var(--transition-fast); color: var(--text-primary);
    }
    .btn-tool:hover { background: var(--primary); color: white; transform: translateY(-2px); }
    #image-status, #bg-image-status { margin-top: 10px; font-size: 0.85rem; color: var(--text-secondary); }

    /* ======================== SPINNER ======================== */
    .spinner {
        display: inline-block; width: 18px; height: 18px;
        border: 3px solid var(--border-color);
        border-top: 3px solid var(--primary);
        border-radius: 50%; animation: spin 0.6s linear infinite;
    }

    /* ======================== STATUS MESSAGE ======================== */
    .status-message {
        padding: 12px 20px; border-radius: 16px;
        margin-top: 20px; display: none;
        text-align: center; font-weight: 600;
    }
    .status-success { background: var(--success); color: white; }
    .status-error { background: var(--danger); color: white; }

    /* ======================== FAB ======================== */
    .fab {
        position: fixed; bottom: 30px; right: 30px;
        width: 60px; height: 60px;
        background: var(--gradient-accent); color: white;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 999; text-decoration: none; border: none; font-size: 2rem;
    }
    .fab:hover { transform: scale(1.1) rotate(90deg); background: var(--primary-dark); box-shadow: 0 15px 30px rgba(79, 70, 229, 0.5); }

    /* ======================== ALERT POPUP ======================== */
    .alert-popup {
        position: fixed; bottom: 100px; right: 30px;
        background: var(--card-bg); border-left: 5px solid var(--primary);
        padding: 16px 24px; box-shadow: var(--shadow-xl);
        border-radius: 0 16px 16px 0; font-weight: 600;
        font-size: 0.95rem; z-index: 1000; display: none;
        animation: slideIn 0.3s ease-out;
        color: var(--text-primary); max-width: 400px;
    }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .alert-popup.success { border-left-color: var(--success); }
    .alert-popup.error { border-left-color: var(--danger); }
    .alert-popup.info { border-left-color: var(--info); }
    .alert-popup.warning { border-left-color: var(--warning); }

    /* ======================== LOADING / ERROR / EMPTY ======================== */
    .loading-container {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 60px 20px; gap: 16px;
    }
    .loading-spinner {
        width: 48px; height: 48px;
        border: 4px solid var(--border-color);
        border-top: 4px solid var(--primary);
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .loading-message { font-weight: 600; font-size: 1.1rem; color: var(--text-primary); }
    .loading-submessage { font-size: 0.85rem; color: var(--text-light); }

    .error-container { text-align: center; padding: 40px 20px; }
    .error-icon { font-size: 2.5rem; color: var(--danger); display: block; margin-bottom: 12px; }
    .error-title { font-weight: 600; color: var(--danger); font-size: 1.1rem; }
    .error-message { margin-top: 4px; font-size: 0.85rem; color: var(--text-secondary); }
    .error-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

    .empty-container { text-align: center; padding: 40px 20px; }
    .empty-icon { font-size: 2.5rem; color: var(--text-light); display: block; margin-bottom: 12px; }
    .empty-title { font-weight: 600; color: var(--text-secondary); font-size: 1.1rem; }
    .empty-subtitle { margin-top: 4px; font-size: 0.85rem; color: var(--text-light); }

    /* ======================== ADMIN BADGE ======================== */
    .admin-badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: rgba(245, 158, 11, 0.15); color: var(--warning);
        padding: 4px 14px; border-radius: 30px;
        font-size: 0.7rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.3px;
        border: 1px solid var(--warning);
        white-space: nowrap; flex-shrink: 0;
    }
    .admin-badge i { font-size: 0.7rem; }
    .admin-badge span { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-badge .session-indicator {
        font-size: 0.45rem; padding: 1px 6px;
        border-radius: 20px; background: rgba(255,255,255,0.15); margin-left: 2px;
    }

    /* ======================== FIELD ERRORS ======================== */
    .field-error {
        display: none; color: var(--danger);
        font-size: 0.72rem; font-weight: 600;
        margin-top: 4px; padding-left: 4px;
        line-height: 1.3; animation: errorFade 0.2s ease-out;
    }
    .field-error.show { display: block; }
    @keyframes errorFade {
        from { opacity: 0; transform: translateY(-4px); }

function readMyAccountSession(key) {
    try {
        const rawLocal = localStorage.getItem(key);
        if (rawLocal) {
            const parsed = JSON.parse(rawLocal);
            if (parsed && typeof parsed === 'object' && 'value' in parsed) {
                if (parsed.expiry && Date.now() >= parsed.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return parsed.value;
            }
            return parsed;
        }
    } catch (e) {}
    try {
        const rawSession = sessionStorage.getItem(key);
        if (rawSession) return JSON.parse(rawSession);
    } catch (e) {}
    return null;
}

function checkAdminAuth() {
    const userType = readMyAccountSession('EGyan_user_type');
    const user     = readMyAccountSession('EGyan_user');
    const userData = readMyAccountSession('EGyan_user_data');
    const expiry   = readMyAccountSession('EGyan_session_expiry');

    if (!userType || !user) return { ok: false, reason: 'no-session' };
    if (userType !== 'admin') return { ok: false, reason: 'not-admin', userType };
    if (expiry && typeof expiry === 'number' && Date.now() >= expiry) {
        ['EGyan_user', 'EGyan_user_data', 'EGyan_user_type',
         'EGyan_remember_me', 'EGyan_session_expiry'].forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
        });
        return { ok: false, reason: 'expired' };
    }
    return { ok: true, userType, user, userData, expiry };
}

function redirectToMyAccount(reason) {
    console.warn('🔒 Admin auth failed:', reason);
    try {
        if (window.top && window.top !== window) {
            window.top.location.href = '../../Study Material/My Account/myaccount.html';
        } else {
            window.location.href = '../../Study Material/My Account/myaccount.html';
        }
    } catch (e) {
        window.location.href = '../../Study Material/My Account/myaccount.html';
    }
}

function revealMainContent() {
    const loading = document.getElementById('authLoading');
    const main = document.getElementById('mainContent');
    if (loading) loading.classList.add('hidden');
    if (main) main.style.display = 'block';
}

function showAccessDeniedAndRedirect(reason) {
    const loading = document.getElementById('authLoading');
    if (loading) {
        loading.innerHTML = `
            <div style="text-align:center; padding: 2rem;">
                <div style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">🔒</div>

                <p style="color: var(--text-light); font-size: 0.8rem; margin-top: 1rem;">
                    Redirecting to My Account...

            </div>
        `;
    }
    setTimeout(() => redirectToMyAccount(reason), 1500);
}

function gateAdminAccess(onAuthorized) {
    const mainEl = document.getElementById('mainContent');
    const loadingEl = document.getElementById('authLoading');
    const alreadyRevealed = mainEl && mainEl.style.display !== 'none' && mainEl.style.display !== '';
    const loadingHidden = loadingEl && loadingEl.classList.contains('hidden');

    if (alreadyRevealed || loadingHidden) {
        console.log('✅ loginadmin.js already authorized this session');
        onAuthorized();
        return;
    }

    const auth = checkAdminAuth();
    if (auth.ok) {
        console.log('✅ Admin auth verified via session keys:', auth.user);
        revealMainContent();
        onAuthorized();
    } else {
        showAccessDeniedAndRedirect(auth.reason);
    }
}

    const localTheme = localStorage.getItem('user-theme-preference');

        document.body.setAttribute('data-theme', localTheme);
        document.documentElement.setAttribute('data-theme', localTheme);
    } else {
        try {
            if (window.parent && window.parent.document.body) {
                const parentTheme = window.parent.document.body.getAttribute('data-theme');
                if (parentTheme) {
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                }
            }
        } catch (e) {}
    }
}
window.addEventListener('DOMContentLoaded', syncThemeWithParent);
window.addEventListener('storage', syncThemeWithParent);
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'themeChange') {
        const newTheme = event.data.theme;
        if (newTheme) {
            document.body.setAttribute('data-theme', newTheme);
            document.documentElement.setAttribute('data-theme', newTheme);

});

            const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
            const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));

            indicator.textContent = 'Session';
            indicator.style.background = 'rgba(255,255,255,0.15)';

    }
}

function debounce(fn, wait = 250) {
    let t;
    return function(...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
    };
}

function formatToDDMMYYYY(dateInput) {
    if (!dateInput || dateInput === '') return '—';
    try {
        if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
            const [year, month, day] = dateInput.split('-');
            return `${day}/${month}/${year}`;
        }
        if (typeof dateInput === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(dateInput)) return dateInput;
        const dateObj = new Date(dateInput);
        if (!isNaN(dateObj.getTime())) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${day}/${month}/${year}`;
        }
        return '—';
    } catch (e) { return '—'; }
}
function formatToYYYYMMDD(dateString) {
    if (!dateString || dateString === '') return '';
    try {
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return dateString;
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) {
            const [day, month, year] = dateString.split('/');
            const testDate = new Date(year, month - 1, day);
            if (!isNaN(testDate.getTime())) return `${year}-${month}-${day}`;
            return '';
        }
        return '';
    } catch (e) { return ''; }
}
function formatDateForDisplay(dateInput) { return formatToDDMMYYYY(dateInput); }

function validateAndFormatDate(dateStr, fieldName = 'Date') {
    if (!dateStr) return { isValid: false, formattedDate: '', error: `${fieldName} is required.` };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
        return { isValid: false, formattedDate: '', error: `Invalid ${fieldName} format. Please select a valid date.` };
    }
    const [year, month, day] = dateStr.split('-');
    const testDate = new Date(year, month - 1, day);
    if (isNaN(testDate.getTime()) || testDate.getFullYear() != year ||
        testDate.getMonth() + 1 != month || testDate.getDate() != day) {
        return { isValid: false, formattedDate: '', error: `Invalid ${fieldName}. Please select a valid date.` };
    }
    return { isValid: true, formattedDate: dateStr, error: '' };
}
function getAcademicYear() {
    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth() + 1;
    return month >= 4 ? `${year}-${year + 1}` : `${year - 1}-${year}`;
}
function combineFullName(firstName, middleName, lastName) {
    const parts = [];
    if (firstName && firstName.trim()) parts.push(firstName.trim());
    if (middleName && middleName.trim()) parts.push(middleName.trim());
    if (lastName && lastName.trim()) parts.push(lastName.trim());
    return parts.join(' ');
}
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}
function extractFileId(driveUrl) {
    if (!driveUrl) return null;
    const match = String(driveUrl).match(/[-\w]{25,}/);
    return match ? match[0] : null;
}
function getThumbnailUrl(driveUrl, width = 400) {
    const fileId = extractFileId(driveUrl);
    if (fileId) return `https://drive.google.com/thumbnail?id=${fileId}&sz=w${width}`;
    return driveUrl;
}
function quickHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return String(h);
}

/* ===== Aadhar helpers ===== */
function formatAadhar(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 12);
    return digits.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
}
function unformatAadhar(value) {
    return String(value || '').replace(/\D/g, '');
}
function validateAadhar(value) {
    const digits = unformatAadhar(value);
    if (!digits) return { valid: false, message: 'Aadhar Card No is required.' };
    if (digits.length !== 12) return { valid: false, message: 'Aadhar must be exactly 12 digits.' };
    if (/^[01]/.test(digits)) return { valid: false, message: 'Aadhar cannot start with 0 or 1.' };
    if (/^(\d)\1{11}$/.test(digits)) return { valid: false, message: 'Aadhar cannot be all identical digits.' };
    return { valid: true, message: '' };
}
function isAadharDuplicate(digits, currentSrNo = null) {
    if (!digits) return false;
    return allStudents.some(s => {
        const existing = unformatAadhar(s['Aadhar Card No'] || '');
        if (!existing || existing !== digits) return false;
        if (currentSrNo !== null && String(s['Sr. No']) === String(currentSrNo)) return false;
        return true;
    });
}

function showToast(msg, type = 'info') {
    const box = dom.alertBox;
    if (!box) return;
    box.textContent = msg;
    box.className = `alert-popup ${type}`;
    box.style.display = 'block';
    clearTimeout(box._timeout);
    box._timeout = setTimeout(() => { box.style.display = 'none'; }, 3500);
}
function showModal(msg, title = "Message", isConfirm = false, onConfirm = null, autoClose = 0) {
    if (!dom.globalModal) return;
    dom.modalTitle.innerText = title;
    dom.modalMsg.innerHTML = msg;
    const confirmBtn = document.getElementById('confirmModalBtn');
    if (confirmBtn) {
        confirmBtn.onclick = () => {
            dom.globalModal.classList.remove('active');
            if (isConfirm && onConfirm) onConfirm();
        };
    }
    dom.globalModal.classList.add('active');
    if (autoClose > 0) setTimeout(() => dom.globalModal.classList.remove('active'), autoClose);
}
function showSpinner(element, show, customHtml = null) {
    if (!element) return;
    if (show) {
        element.disabled = true;
        if (!element.hasAttribute('data-original-text')) {
            element.setAttribute('data-original-text', element.innerHTML);
        }
        element.innerHTML = customHtml || '<span class="spinner"></span> Loading...';
    } else {
        element.disabled = false;
        const original = element.getAttribute('data-original-text');
        if (original) {
            element.innerHTML = original;
            element.removeAttribute('data-original-text');
        }
    }
}

function clearAllCaches() {

        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(CACHE_VERSION_KEY);
        return true;
    } catch (e) { return false; }
}
function invalidateStudentCache() {
    try {
        allStudents = [];
        dataLoaded = false;
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(CACHE_VERSION_KEY);
    } catch (e) {}
}
function getCache() {
    try {
        const cachedVersion = localStorage.getItem(CACHE_VERSION_KEY);
        if (cachedVersion !== CURRENT_CACHE_VERSION) {
            localStorage.removeItem(CACHE_KEY);
            localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
            return null;
        }
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { data, timestamp, sheetName } = JSON.parse(cached);
            if (sheetName !== SHEET_NAME) { localStorage.removeItem(CACHE_KEY); return null; }
            if (Date.now() - timestamp < CACHE_TTL) return data;
            localStorage.removeItem(CACHE_KEY);
        }
    } catch (e) { localStorage.removeItem(CACHE_KEY); }
    return null;
}
function setCache(data) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
            data, timestamp: Date.now(), sheetName: SHEET_NAME
        }));
        localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
    } catch (e) {}
}

function getDropdownCache() {

        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        if (Date.now() - ts > DD_CACHE_TTL) { localStorage.removeItem(DD_CACHE_KEY); return null; }
        return data;
    } catch (e) { return null; }
}
function setDropdownCache(data) {
    try { localStorage.setItem(DD_CACHE_KEY, JSON.stringify({ data, ts: Date.now() })); } catch (e) {}
}
function invalidateDropdownCache() {
    try { localStorage.removeItem(DD_CACHE_KEY); } catch (e) {}
}

async function fetchExistingDropdownData(force = false) {
    if (force) invalidateDropdownCache();
    const url = `${SCRIPT_URL}?spreadsheetId=${DROPDOWN_SHEET_ID}` +
                `&sheetName=${DROPDOWN_SHEET_NAME}&_=${Date.now()}`;
    try {
        const res = await fetch(url);
        const json = await res.json();
        if (json.status === 'success' && Array.isArray(json.data)) {
            try {
                localStorage.setItem(DD_CACHE_KEY, JSON.stringify({
                    data: { raw: json.data }, ts: Date.now()
                }));
            } catch (e) {}
            return json.data;
        }
    } catch (e) {
        console.error('fetchExistingDropdownData failed:', e);
    }
    return [];
}

function updateDropdownOptionsFromData(data) {
    const courses = new Set();
    const studies = new Set();
    (data || []).forEach(row => {
        const c = String(row['Course Name'] || '').trim();
        const s = String(row['Study In']    || '').trim();
        if (c) courses.add(c);
        if (s) studies.add(s);
    });
    admInOptions.length = 0;
    admInOptions.push(...Array.from(courses));
    studyInOptions.length = 0;
    studyInOptions.push(...Array.from(studies));
}

async function loadDropdowns(forceRefresh = false) {
    if (!forceRefresh) {
        const cached = getDropdownCache();
        if (cached && cached.raw && cached.raw.length) {
            updateDropdownOptionsFromData(cached.raw);
            dropdownsLoaded = true;
            return;
        }
    }
    try {
        const data = await fetchExistingDropdownData(forceRefresh);
        updateDropdownOptionsFromData(data);
        setDropdownCache({ raw: data });
        dropdownsLoaded = true;
    } catch (err) {
        console.warn('Dropdown load failed:', err);
        if (!dropdownsLoaded) { admInOptions.length = 0; studyInOptions.length = 0; }
    }
}

async function smartSaveToDropdownSheet(courseName, studyIn, existingData) {
    const addedItems = [];
    let dataModified = false;

    const normCourse = courseName ? String(courseName).trim() : '';
    const normStudy  = studyIn    ? String(studyIn).trim()    : '';

    if (!normCourse && !normStudy) return { addedItems, dataModified };

    const data = JSON.parse(JSON.stringify(existingData || []));

    const courseExists = normCourse && data.some(r => String(r['Course Name'] || '').trim() === normCourse);
    const studyExists  = normStudy  && data.some(r => String(r['Study In']    || '').trim() === normStudy);

    const isEmptyBoth    = r => (!r['Course Name'] || String(r['Course Name']).trim() === '') &&
                                (!r['Study In']    || String(r['Study In']).trim()    === '');
    const isEmptyCourse  = r => (!r['Course Name'] || String(r['Course Name']).trim() === '');
    const isEmptyStudy   = r => (!r['Study In']    || String(r['Study In']).trim()    === '');

    const maxSr = () => data.reduce((m, r) => Math.max(m, parseInt(r['Sr. No']) || 0), 0);

    if (normCourse && normStudy && !courseExists && !studyExists) {
        const idx = data.findIndex(isEmptyBoth);
        if (idx !== -1) {
            const srNo = data[idx]['Sr. No'];
            const rowIndex = parseInt(srNo) + 1;
            const ok = await updateDropdownRow(rowIndex, srNo, normCourse, normStudy);
            if (ok) {
                addedItems.push(`Added "${normCourse}" + "${normStudy}" to existing empty row (Sr. No ${srNo})`);
                data[idx]['Course Name'] = normCourse;
                data[idx]['Study In']    = normStudy;
                dataModified = true;
            }
        } else {
            const newSr = maxSr() + 1;
            const ok = await addRowToDropdownSheet(newSr, normCourse, normStudy);
            if (ok) {
                addedItems.push(`Created new entry: "${normCourse}" + "${normStudy}" (Sr. No ${newSr})`);
                data.push({ 'Sr. No': String(newSr), 'Course Name': normCourse, 'Study In': normStudy });
                dataModified = true;
            }
        }
    } else if (normCourse && !courseExists) {
        let idx = -1;
        if (normStudy) idx = data.findIndex(r => isEmptyCourse(r) && String(r['Study In'] || '').trim() === normStudy);
        if (idx === -1) idx = data.findIndex(isEmptyCourse);
        if (idx !== -1) {
            const srNo = data[idx]['Sr. No'];
            const rowIndex = parseInt(srNo) + 1;
            const exStudy = data[idx]['Study In'] || '';
            const ok = await updateDropdownRow(rowIndex, srNo, normCourse, exStudy);
            if (ok) {
                addedItems.push(`Added Course Name "${normCourse}" to existing row (Sr. No ${srNo})`);
                data[idx]['Course Name'] = normCourse;
                dataModified = true;
            }
        } else {
            const newSr = maxSr() + 1;
            const ok = await addRowToDropdownSheet(newSr, normCourse, normStudy || '');
            if (ok) {
                addedItems.push(`Created new Course Name entry: "${normCourse}" (Sr. No ${newSr})`);
                data.push({ 'Sr. No': String(newSr), 'Course Name': normCourse, 'Study In': normStudy || '' });
                dataModified = true;
            }
        }
    } else if (normStudy && !studyExists) {
        let idx = -1;
        if (normCourse) idx = data.findIndex(r => isEmptyStudy(r) && String(r['Course Name'] || '').trim() === normCourse);
        if (idx === -1) idx = data.findIndex(isEmptyStudy);
        if (idx !== -1) {
            const srNo = data[idx]['Sr. No'];
            const rowIndex = parseInt(srNo) + 1;
            const exCourse = data[idx]['Course Name'] || '';
            const ok = await updateDropdownRow(rowIndex, srNo, exCourse, normStudy);
            if (ok) {
                addedItems.push(`Added Study In "${normStudy}" to existing row (Sr. No ${srNo})`);
                data[idx]['Study In'] = normStudy;
                dataModified = true;
            }
        } else {
            const newSr = maxSr() + 1;
            const ok = await addRowToDropdownSheet(newSr, normCourse || '', normStudy);
            if (ok) {
                addedItems.push(`Created new Study In entry: "${normStudy}" (Sr. No ${newSr})`);
                data.push({ 'Sr. No': String(newSr), 'Course Name': normCourse || '', 'Study In': normStudy });
                dataModified = true;
            }
        }
    }

    if (dataModified) {
        try {
            localStorage.setItem(DD_CACHE_KEY, JSON.stringify({
                data: { raw: data }, ts: Date.now()
            }));
        } catch (e) {}
        updateDropdownOptionsFromData(data);
    }
    return { addedItems, dataModified };
}

async function pushDraftToSheet(payloadObj, hasMainImg) {
    if (!autosaveEnabled) return;
    if (draftSaveInFlight) return;

    const payloadStr = JSON.stringify(payloadObj);
    const hash = quickHash(payloadStr + '|' + hasMainImg);
    if (hash === lastDraftPayloadHash) return;
    lastDraftPayloadHash = hash;

    draftSaveInFlight = true;
    try {
        const params = new URLSearchParams();
        params.append('spreadsheetId', SPREADSHEET_ID);
        params.append('sheetName', DRAFTS_SHEET_NAME);

        if (currentDraftRowIndex && currentDraftId) {
            params.append('action', 'update');
            params.append('rowIndex', String(currentDraftRowIndex));
            params.append('Draft ID', currentDraftId);
        } else {
            params.append('action', 'insert');
            currentDraftId = 'D' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            params.append('Draft ID', currentDraftId);
        }

        params.append('Timestamp', new Date().toISOString());
        params.append('Payload JSON', payloadStr);
        params.append('Has Main Image', hasMainImg ? 'TRUE' : 'FALSE');
        params.append('Has Bg Image', 'FALSE'); // ❌ kept for schema compatibility
        params.append('Session Key', getSessionKey());

        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString(),
            keepalive: true
        });
        const json = await res.json();
        if (json.status === 'success' && json.data && json.data.rowIndex) {
            currentDraftRowIndex = Number(json.data.rowIndex);
        }
        updateDraftStatus('Saved ' + new Date().toLocaleTimeString());
    } catch (err) {
        console.warn('Draft autosave failed (non-blocking):', err);
        updateDraftStatus('Save failed');
    } finally {
        draftSaveInFlight = false;
    }
}

function scheduleDraftSave() {
    if (!autosaveEnabled) return;
    clearTimeout(draftDebounceTimer);
    draftDebounceTimer = setTimeout(() => {
        const snapshot = readFormSnapshot();
        if (!snapshot) return;

        const hasAnyData = Object.values(snapshot).some(v => v && String(v).trim() !== '')
                        || !!croppedImageData;
        if (!hasAnyData) return;

        try {
            if (croppedImageData) {
                localStorage.setItem(DRAFT_LS_KEY + '_main', JSON.stringify(croppedImageData));
            } else {
                localStorage.removeItem(DRAFT_LS_KEY + '_main');
            }
            // ❌ REMOVED: bg image stash
        } catch (e) {}

        pushDraftToSheet(snapshot, !!croppedImageData);
    }, DRAFT_DEBOUNCE_MS);
}

async function clearDraft() {
    clearTimeout(draftDebounceTimer);
    lastDraftPayloadHash = null;

    if (currentDraftRowIndex) {
        try {
            const params = new URLSearchParams({
                action: 'delete',
                spreadsheetId: SPREADSHEET_ID,
                sheetName: DRAFTS_SHEET_NAME,
                rowIndex: String(currentDraftRowIndex)
            });
            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString(),
                keepalive: true
            });
        } catch (e) { /* ignore */ }
    }

    currentDraftRowIndex = null;
    currentDraftId = null;

    try {
        localStorage.removeItem(DRAFT_LS_KEY + '_main');
        localStorage.removeItem(DRAFT_LS_KEY + '_bg'); // cleanup old keys
        localStorage.removeItem(DRAFT_LS_KEY + '_meta');
    } catch (e) {}
}

function getSessionKey() {
    let key = sessionStorage.getItem('egyan_session_key');
    if (!key) {
        key = 'S' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        sessionStorage.setItem('egyan_session_key', key);
    }
    return key;
}

async function maybeRestoreDraft() {
    try {
        const cachedRaw = localStorage.getItem(DRAFT_LS_KEY + '_meta');
        if (!cachedRaw) return;
        const meta = JSON.parse(cachedRaw);
        if (!meta || !meta.payload) return;
        if (Date.now() - (meta.savedAt || 0) > DRAFT_RESTORE_TTL_MS) {
            localStorage.removeItem(DRAFT_LS_KEY + '_meta');
            return;
        }

        showModal(
            `📝 A recent unsaved draft was found (saved ${Math.round((Date.now() - meta.savedAt) / 60000)} min ago).<br><br>Restore it?`,
            'Restore Draft?',
            true,
            () => {
                const form = document.getElementById('studentForm');
                if (!form) return;
                const p = meta.payload;
                const setVal = (id, v) => {
                    const el = document.getElementById(id);
                    if (el) el.value = v || '';
                };
                setVal('fAcademicYear', p['Academic Year']);
                setVal('fDateOfAdm', p['Date of Adm']);
                setVal('fFirstName', p['First Name']);
                setVal('fMiddleName', p['Middle Name']);
                setVal('fLastName', p['Last Name']);
                setVal('fFatherName', p['Father Name']);
                setVal('fMotherName', p['Mother Name']);
                setVal('fFatherOccupation', p['Father Occupation']);
                setVal('fAadhar', formatAadhar(p['Aadhar Card No']));
                setVal('fAdmIn', p['Adm In']);
                setVal('fStudyIn', p['Study In']);
                setVal('fBirthDate', p['Birth Date']);
                setVal('fGender', p['Gender']);
                setVal('fEmail', p['Email Id']);
                setVal('fPersonalMobile', p['Personal Mob No']);
                setVal('fParentMobile', p['Parent Mob No']);
                setVal('fLastSchool', p['Last School Name']);
                setVal('fAddress', p['Address']);
                setVal('fNote', p['Note']);

                try {
                    const mainRaw = localStorage.getItem(DRAFT_LS_KEY + '_main');
                    if (mainRaw) {
                        croppedImageData = JSON.parse(mainRaw);
                        const s = document.getElementById('image-status');
                        if (s) {
                            s.textContent = '✅ Restored draft image (pending upload)';
                            s.style.color = 'var(--success)';
                        }
                    }
                    // ❌ REMOVED: bg image restore
                } catch (e) {}

                currentDraftId = meta.draftId || null;
                currentDraftRowIndex = meta.rowIndex || null;
                showToast('✅ Draft restored', 'success');
            }
        );
    } catch (e) { /* ignore */ }
}

async function loadStudents(forceRefresh = false) {
    const tableBody = dom.tableBody;
    if (!tableBody) return [];

    if (!forceRefresh && dataLoaded) { renderTable(); return allStudents; }

    try {
        if (!forceRefresh) {
            const cached = getCache();
            if (cached && Array.isArray(cached) && cached.length > 0) {
                allStudents = cached;
                dataLoaded = true;
                renderTable();
                showToast(`📦 Loaded ${allStudents.length} students from cache`, "info");
                scheduleIdleRefresh();
                isLoading = false;
                return allStudents;
            }
        }

        tableBody.innerHTML = buildSkeletonRows(5);  // 🆕 5 rows for 5 columns

        const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

        const result = await response.json();
        if (result.status === "success" && Array.isArray(result.data)) {
            allStudents = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(allStudents);
            dataLoaded = true;
            renderTable();
            showToast(`✅ Loaded ${allStudents.length} students`, "success");
            isLoading = false;
            return allStudents;
        } else {
            throw new Error(result.message || "Failed to load data");
        }
    } catch (err) {
        console.error('❌ Load students error:', err);
        try {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const { data, sheetName } = JSON.parse(cached);
                if (data && Array.isArray(data) && data.length > 0 && sheetName === SHEET_NAME) {
                    allStudents = data;
                    dataLoaded = true;
                    renderTable();
                    showToast("⚠️ Using cached data (offline mode)", "warning");
                    isLoading = false;
                    return allStudents;
                }
            }
        } catch (e) {}

        tableBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="error-container">
                        <span class="error-icon">⚠️</span>
                        <p class="error-title">Failed to load data</p>
                        <p class="error-message">${escapeHtml(err.message)}</p>
                        <div class="error-actions">
                            <button onclick="handleRetry()" class="btn btn-primary" style="padding: 10px 24px;">
                                <span>⟳</span> Retry
                            </button>
                            <button onclick="handleClearCache()" class="btn btn-outline" style="padding: 10px 24px;">
                                <span>🧹</span> Clear Cache & Retry
                            </button>
                        </div>
                    </div>
                </td>
            </tr>
        `;
        isLoading = false;
        return [];
    }
}
function scheduleIdleRefresh() {
    const run = () => refreshDataInBackground();
    if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 4000 });
    else setTimeout(run, 2000);
}
async function refreshDataInBackground() {
    try {
        const response = await fetch(
            `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${SHEET_NAME}&_=${Date.now()}`
        );
        const result = await response.json();
        if (result.status === "success" && Array.isArray(result.data)) {
            const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            if (JSON.stringify(allStudents) !== JSON.stringify(newData)) {
                allStudents = newData;
                setCache(allStudents);
                renderTable();
            }
        }
    } catch (err) {}
}
async function refreshData() {
    const refreshBtn = dom.refreshBtn;
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    showSpinner(refreshBtn, true);
    if (mobileRefreshBtn) {
        mobileRefreshBtn.disabled = true;

   SECTION 13 — TABLE RENDERING (5 columns: Sr. No, Name, Mobile, Adm In, Action)
   ===================================================================== */

function scheduleRender(filter = "") {
    pendingRenderFilter = filter;
    if (renderRafHandle) return;
    renderRafHandle = requestAnimationFrame(() => {
        renderRafHandle = null;
        renderTable(pendingRenderFilter);
    });
}
function renderTable(filter = "") {
    if (!dom.tableBody) return;

    if (!allStudents || allStudents.length === 0) {
        dom.tableBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-container">
                        <span class="empty-icon">📚</span>
                        <p class="empty-title">No students found</p>
                        <p class="empty-subtitle">Click "Add Admission" to add your first student</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    const searchLower = filter.toLowerCase().trim();
    let filtered = allStudents;
    if (searchLower) {
        filtered = allStudents.filter(s => {
            const fullName = combineFullName(
                s['First Name'] || '', s['Middle Name'] || '', s['Last Name'] || ''
            ).toLowerCase();
            const mobile  = String(s['Personal Mob No'] || '').toLowerCase();
            const admIn   = String(s['Adm In'] || '').toLowerCase();
            const studyIn = String(s['Study In'] || '').toLowerCase();
            return fullName.includes(searchLower) || mobile.includes(searchLower)
                || admIn.includes(searchLower) || studyIn.includes(searchLower);
        });
    }

    if (!filtered.length) {
        dom.tableBody.innerHTML = `
            <tr>
                <td colspan="5">
                    <div class="empty-container">
                        <span class="empty-icon">🔍</span>
                        <p class="empty-title">No matching students found</p>
                        <p class="empty-subtitle">Try adjusting your search</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    /* ✅ NEWEST-FIRST: sort by Sr. No desc, then _rowIndex desc as tiebreaker */
    const sorted = filtered.slice().sort((a, b) => {
        const srA = parseInt(a['Sr. No']) || 0;
        const srB = parseInt(b['Sr. No']) || 0;
        if (srA !== srB) return srB - srA;
        return (b._rowIndex || 0) - (a._rowIndex || 0);
    });

    let html = '';
    for (let i = 0; i < sorted.length; i++) {
        const s = sorted[i];
        const fullName = combineFullName(
            s['First Name'] || '', s['Middle Name'] || '', s['Last Name'] || ''
        ) || '—';
        const admIn = s['Adm In'] || '';
        const srNo = s['Sr. No'] || '';
        // Look up original index in allStudents so edit/delete/view still target the right sheet row
        const actualIndex = allStudents.indexOf(s);

        html += `
            <tr>
                <td><strong>${escapeHtml(String(srNo || (actualIndex + 2)))}</strong></td>
                <td>${escapeHtml(fullName)}</td>
                <td>${escapeHtml(s['Personal Mob No'] || '—')}</td>
                <td>${escapeHtml(admIn || '—')}</td>
                <td>
                    <button class="view-action-btn"
                            data-sr="${escapeHtml(srNo)}"
                            data-adm="${escapeHtml(admIn)}"
                            data-actual-index="${actualIndex}"
                            data-full-name="${escapeHtml(fullName)}">
                        👁️ View
                    </button>
                </td>
            </tr>
        `;
    }
    dom.tableBody.innerHTML = html;
}

function handleTableClick(e) {
    const btn = e.target.closest('.view-action-btn');
    if (!btn) return;
    e.stopPropagation();

    const srVal = btn.getAttribute('data-sr');
    const admVal = btn.getAttribute('data-adm');
    const actualIndex = parseInt(btn.getAttribute('data-actual-index'), 10);
    const fullName = btn.getAttribute('data-full-name');

    let found = null;
    if (srVal) found = allStudents.find(s => String(s['Sr. No']) === String(srVal));
    if (!found && !isNaN(actualIndex) && actualIndex >= 0 && actualIndex < allStudents.length) {
        found = allStudents[actualIndex];
    }
    if (!found && admVal) found = allStudents.find(s => String(s['Adm In']) === String(admVal));
    if (!found && fullName) {
        found = allStudents.find(s => combineFullName(
            s['First Name'] || '', s['Middle Name'] || '', s['Last Name'] || ''
        ) === fullName);
    }

    if (found) {
        currentViewStudent = found;
        currentEditStudent = found;
        selectedSrNo = found['Sr. No'];
        selectedAdmIn = found['Adm In'];
        selectedRowIndex = found._rowIndex || 2;
        showDetailView(found);
    } else {
        showToast("❌ Student not found. Please refresh the page.", "error");
    }
}

function findRowIndexBySrNo(srNo) {
    if (srNo === null || srNo === undefined || srNo === '') return null;
    const idx = allStudents.findIndex(s => String(s['Sr. No']) === String(srNo));
    return idx !== -1 ? idx + 2 : null;
}
function findRowIndexByAdmIn(admIn) {
    if (!admIn) return null;
    const idx = allStudents.findIndex(s => String(s['Adm In']) === String(admIn));
    if (idx !== -1) return idx + 2;
    return null;
}

/* =====================================================================
   SECTION 18 — DELETE STUDENT
   ===================================================================== */

async function deleteStudent() {
    const srNoToDelete = selectedSrNo ?? currentViewStudent?.['Sr. No'];
    if (srNoToDelete === null || srNoToDelete === undefined || srNoToDelete === '') {
        showToast('❌ No student Sr. No recorded. Please click View again.', 'error');
        return;
    }

    const displayName = dom.profileName?.textContent || 'this student';

    showModal(
        `⚠️ Are you sure you want to delete <strong>${escapeHtml(displayName)}</strong> ` +
        `(Sr. No: ${escapeHtml(String(srNoToDelete))})?<br><br>` +
        `This action cannot be undone and will remove the student's record and all associated files.`,
        'Confirm Delete',
        true,
        async () => {
            showSpinner(dom.deleteBtn, true);
            try {
                clearAllCaches();
                dataLoaded = false;

                const freshUrl = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}` +
                                 `&sheetName=${SHEET_NAME}&_=${Date.now()}`;
                const freshRes = await fetch(freshUrl);
                const freshResult = await freshRes.json();

                if (freshResult.status !== 'success' || !Array.isArray(freshResult.data)) {
                    throw new Error(freshResult.message || 'Failed to refresh data');
                }

                allStudents = freshResult.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));

                const freshIdx = allStudents.findIndex(
                    s => String(s['Sr. No']) === String(srNoToDelete)
                );
                if (freshIdx === -1) {
                    throw new Error(`Student with Sr. No "${srNoToDelete}" not found on server.`);
                }

                const liveRowIndex = freshIdx + 2;

                const params = new URLSearchParams();
                params.append('action', 'delete');
                params.append('spreadsheetId', SPREADSHEET_ID);
                params.append('sheetName', SHEET_NAME);
                params.append('rowIndex', liveRowIndex);
                params.append('Sr. No', srNoToDelete);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                const result = await response.json();

                if (result.status === 'success') {
                    currentViewStudent = null;
                    currentEditStudent = null;
                    selectedSrNo = null;
                    selectedAdmIn = null;
                    selectedRowIndex = null;
                    invalidateStudentCache();
                    showModal('✅ Deleted successfully! Sr. No reset.', 'Success', false, null, 1200);
                    await loadStudents(true);
                    goToListView();
                } else {
                    showModal('❌ Delete failed: ' + (result.message || 'Unknown error'), 'Error');
                    invalidateStudentCache();
                    await loadStudents(true);
                }
            } catch (err) {
                showModal('❌ Error: ' + err.message, 'Error');
            } finally {
                showSpinner(dom.deleteBtn, false);
            }
        }
    );
}

function getPrintImageUrl(driveUrl) {
    const fileId = extractFileId(driveUrl);
    if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
    if (driveUrl && String(driveUrl).startsWith('http')) return driveUrl;
    return '';
}
async function urlToDataUri(url, timeoutMs = 8000) {
    if (!url) return '';
    try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        const response = await fetch(url, {
            mode: 'cors', credentials: 'omit', cache: 'force-cache',
            signal: controller.signal
        });
        clearTimeout(timer);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const blob = await response.blob();
        if (!blob || blob.size === 0) throw new Error('Empty blob');
        return await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result || '');
            reader.onerror = () => resolve('');
            reader.readAsDataURL(blob);
        });
    } catch (err) { return ''; }
}
async function preloadPrintImages(student) {
    const photoRaw = student && student['Image'] ? student['Image'] : '';
    const photoLh3 = photoRaw ? getPrintImageUrl(photoRaw) : '';
    const [photoDataUri, logoDataUri] = await Promise.all([
        photoLh3 ? urlToDataUri(photoLh3) : Promise.resolve(''),
        urlToDataUri(LOGO_URL)
    ]);
    return { photoDataUri, logoDataUri };
}

async function printAdmissionForm() {
    const record = currentViewStudent;
    if (!record) { showToast("❌ No student data to print", "error"); return; }

    const fullName = combineFullName(
        record['First Name'] || '', record['Middle Name'] || '', record['Last Name'] || ''
    ) || 'Student';
    const todayStr = new Date().toLocaleDateString('en-GB');

    showToast("📄 Preparing form for print...", "info");

    let photoDataUri = '', logoDataUri = '';
    try {
        const pre = await preloadPrintImages(record);
        photoDataUri = pre.photoDataUri;
        logoDataUri = pre.logoDataUri;
    } catch (e) {}

    const imgUrl = getPrintImageUrl(record['Image'] || '');
    const printHtml = generatePDFHTML(record, fullName, todayStr, imgUrl, logoDataUri, photoDataUri);

    const printWindow = window.open('', '_blank',
        'width=900,height=1200,toolbar=yes,scrollbars=yes,resizable=yes,menubar=no');
    if (!printWindow) { showToast("❌ Please allow pop-ups to print", "error"); return; }

    printWindow.document.write(printHtml);
    printWindow.document.close();

    printWindow.onload = function() {
        setTimeout(() => { printWindow.focus(); printWindow.print(); }, 800);
    };
}

/* =====================================================================
   SECTION 22 — DOWNLOAD PDF
   ===================================================================== */

function downloadAdmissionPDF() {
    const record = currentViewStudent;
    if (!record) { showToast("❌ No student data to download", "error"); return; }

    if (typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
        showToast("📥 Loading PDF libraries...", "info");
        const loadHtml2Canvas = new Promise((resolve, reject) => {
            if (typeof html2canvas !== 'undefined') { resolve(); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            script.onload = resolve; script.onerror = reject;
            document.head.appendChild(script);
        });
        const loadJsPDF = new Promise((resolve, reject) => {
            if (typeof jspdf !== 'undefined') { resolve(); return; }
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
            script.onload = resolve; script.onerror = reject;
            document.head.appendChild(script);
        });
        Promise.all([loadHtml2Canvas, loadJsPDF])
            .then(() => { showToast("✅ Libraries loaded, generating PDF...", "success"); generatePDFWithCanvas(record); })
            .catch((err) => { showToast("❌ Failed to load PDF libraries. Please try again.", "error"); });
        return;
    }
    generatePDFWithCanvas(record);
}

async function generatePDFWithCanvas(record) {
    const fullName = combineFullName(
        record['First Name'] || '', record['Middle Name'] || '', record['Last Name'] || ''
    ) || 'Student';
    const todayStr = new Date().toLocaleDateString('en-GB');

    showSpinner(dom.downloadBtn, true);
    showToast("📄 Generating PDF, please wait...", "info");

    let photoDataUri = '', logoDataUri = '';
    try {
        const pre = await preloadPrintImages(record);
        photoDataUri = pre.photoDataUri;
        logoDataUri = pre.logoDataUri;
    } catch (e) {}

    const imgUrl = getPrintImageUrl(record['Image'] || '');
    const pdfHtml = generatePDFHTML(record, fullName, todayStr, imgUrl, logoDataUri, photoDataUri);

    const container = document.createElement('div');
    container.style.position = 'fixed';
    container.style.left = '-9999px';
    container.style.top = '0';
    container.style.width = '794px';
    container.style.height = '1123px';
    container.style.background = 'white';
    container.style.zIndex = '-1';
    container.style.padding = '0';
    container.style.margin = '0';
    container.style.overflow = 'hidden';
    container.innerHTML = pdfHtml;
    document.body.appendChild(container);

    const images = container.querySelectorAll('img');
    const imagePromises = Array.from(images).map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
            img.onload = resolve;
            img.onerror = resolve;
            setTimeout(resolve, 3000);
        });
    });

    Promise.all(imagePromises).then(() => {
        setTimeout(() => {
            html2canvas(container, {
                scale: 2, useCORS: true, allowTaint: false, logging: false,
                backgroundColor: '#ffffff',
                width: 794, height: 1123,
                windowWidth: 794, windowHeight: 1123,
                onclone: (clonedDoc) => {
                    const wm = clonedDoc.querySelector('.watermark');
                    if (wm) {
                        wm.style.display = 'block';
                        wm.style.visibility = 'visible';
                        wm.style.opacity = '0.08';
                    }
                    const wmImg = clonedDoc.querySelector('.watermark img');
                    if (wmImg) {
                        wmImg.style.display = 'block';
                        wmImg.style.visibility = 'visible';
                        wmImg.style.opacity = '1';
                    }
                }
            }).then(canvas => {
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                    pdf.save(`Admission_Form_${fullName.replace(/\s/g, '_')}.pdf`);
                    document.body.removeChild(container);
                    showToast("✅ PDF downloaded successfully!", "success");
                    if (dom.downloadBtn) showSpinner(dom.downloadBtn, false);
                } catch (err) {
                    document.body.removeChild(container);
                    showToast("❌ Error generating PDF: " + err.message, "error");
                    if (dom.downloadBtn) showSpinner(dom.downloadBtn, false);
                }
            }).catch(err => {
                document.body.removeChild(container);
                showToast("❌ Error rendering content: " + err.message, "error");
                if (dom.downloadBtn) showSpinner(dom.downloadBtn, false);
            });
        }, 300);
    });
}

function setFieldError(fieldId, message) {
    const errEl = document.getElementById('err-' + fieldId);
    const inputEl = document.getElementById(fieldId);
    if (errEl) {
        if (message) { errEl.textContent = message; errEl.classList.add('show'); }
        else { errEl.textContent = ''; errEl.classList.remove('show'); }
    }
    if (inputEl) {
        inputEl.classList.toggle('field-invalid', !!message);
        inputEl.classList.toggle('field-valid', !message && inputEl.value.trim() !== '');
    }
}
function clearAllFieldErrors(fieldIds) {
    fieldIds.forEach(id => setFieldError(id, ''));
}

/* =====================================================================
   SECTION 25 — VALIDATORS
   ===================================================================== */

function validateSingleWordName(value, fieldLabel) {
    const trimmed = (value || '').trim();
    if (!trimmed) return { valid: false, message: `${fieldLabel} is required.` };
    if (trimmed.length < 2) return { valid: false, message: `${fieldLabel} must be at least 2 characters.` };
    if (trimmed.length > 30) return { valid: false, message: `${fieldLabel} must be under 30 characters.` };
    if (/\s/.test(trimmed)) return { valid: false, message: `${fieldLabel} must be a single word (no spaces).` };
    if (!/^[A-Za-z][A-Za-z.'-]*$/.test(trimmed)) return { valid: false, message: `${fieldLabel} can only contain letters, apostrophes, dots, and hyphens.` };
    return { valid: true, message: '' };
}
function validateEmailFormat(email) {
    const trimmed = (email || '').trim();
    if (!trimmed) return { valid: false, message: 'Email ID is required.' };
    const emailRegex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
    if (!emailRegex.test(trimmed)) return { valid: false, message: 'Please enter a valid email address (e.g. name@gmail.com).' };
    if (trimmed.includes('..')) return { valid: false, message: 'Email cannot contain consecutive dots (..).' };
    return { valid: true, message: '' };
}
function isEmailDuplicate(email, currentSrNo = null) {
    const trimmed = (email || '').trim().toLowerCase();
    if (!trimmed) return false;
    return allStudents.some(s => {
        const existingEmail = String(s['Email Id'] || '').trim().toLowerCase();
        if (!existingEmail || existingEmail !== trimmed) return false;
        if (currentSrNo !== null && String(s['Sr. No']) === String(currentSrNo)) return false;
        return true;
    });
}

/* =====================================================================
   SECTION 26 — AUTOCOMPLETE
   ===================================================================== */

function setupAutocomplete(inputId, listId, optionsArray) {
    const input  = document.getElementById(inputId);
    const listEl = document.getElementById(listId);
    if (!input || !listEl) return;

    let debounceId = null;

    function render(filterVal = '') {
        const term = filterVal.toLowerCase();
        const filtered = term
            ? optionsArray.filter(o => o.toLowerCase().includes(term))
            : optionsArray;

        if (!filtered.length) { listEl.style.display = 'none'; return; }

        listEl.innerHTML = filtered.map(opt =>
            `<div class="autocomplete-item" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`
        ).join('');
        listEl.style.display = 'block';
    }

    input.addEventListener('input', (e) => {
        if (debounceId) clearTimeout(debounceId);
        debounceId = setTimeout(() => render(e.target.value), 180);
    });
    input.addEventListener('focus', () => render(input.value));
    input.addEventListener('blur',  () => setTimeout(() => {
        listEl.style.display = 'none';
    }, 180));

    listEl.addEventListener('click', (e) => {
        const item = e.target.closest('.autocomplete-item');
        if (!item) return;
        input.value = item.getAttribute('data-value');
        listEl.style.display = 'none';
        input.dispatchEvent(new Event('input', { bubbles: true }));
    });

    document.addEventListener('click', (e) => {
        if (!listEl.contains(e.target) && e.target !== input) listEl.style.display = 'none';
    });
}

function rotateMain(deg) { if (cropperMain) cropperMain.rotate(deg); }

function applyCropMain() {
    if (!cropperMain) {
        document.getElementById('image-status').textContent = "❌ No image loaded to crop.";
        return;
    }
    try {
        const canvas = cropperMain.getCroppedCanvas({ width: 400, height: 400 });
        if (!canvas) throw new Error('crop failed');
        const base64 = canvas.toDataURL('image/jpeg', 0.9);
        croppedImageData = {
            base64Data: base64.split(',')[1],
            fileName:   `student_photo_${Date.now()}.jpg`,
            mimeType:   'image/jpeg'
        };
        const s = document.getElementById('image-status');
        s.textContent = '✅ Image cropped and ready!';
        s.style.color = 'var(--success)';
        const old = document.getElementById('cropped-preview');
        if (old) old.remove();
        const preview = document.createElement('img');
        preview.id = 'cropped-preview';
        preview.src = base64;
        preview.style.maxWidth = '100px';
        preview.style.marginTop = '10px';
        preview.style.borderRadius = '8px';
        preview.style.border = '2px solid var(--primary)';
        document.getElementById('preview-container').appendChild(preview);

    } catch (e) {
        const s = document.getElementById('image-status');
        s.textContent = '❌ Failed to crop image.';
        s.style.color = 'var(--danger)';
    }
}
